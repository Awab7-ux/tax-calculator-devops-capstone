apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: npm
spec:
  params:
    - name: ARGS
      description: The npm command to run
      type: array
      default:
        - "--help"
  workspaces:
    - name: source
  steps:
    - name: npm
      image: node:18-alpine
      workingDir: $(workspaces.source.path)
      command:
        - npm
      args:
        - $(params.ARGS)
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: jasmine
spec:
  workspaces:
    - name: source
  steps:
    - name: jasmine
      image: node:18-alpine
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        npm install
        npx jasmine
