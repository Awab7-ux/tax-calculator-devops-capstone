apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: tax-calculator
spec:
  params:
    - name: git-url
      type: string
    - name: git-revision
      type: string
      default: main
    - name: image
      type: string
    - name: ibm-region
      type: string
    - name: ibm-resource-group
      type: string
    - name: code-engine-project
      type: string
    - name: application
      type: string
      default: tax-calculator
  workspaces:
    - name: shared-data
    - name: registry-auth
    - name: ibm-credentials
  tasks:
    - name: clone
      taskRef:
        name: clone-source
      params:
        - name: url
          value: $(params.git-url)
        - name: revision
          value: $(params.git-revision)
      workspaces:
        - name: source
          workspace: shared-data
    - name: lint
      runAfter: [clone]
      taskRef:
        name: flake8
      workspaces:
        - name: source
          workspace: shared-data
    - name: test
      runAfter: [lint]
      taskRef:
        name: pytest
      workspaces:
        - name: source
          workspace: shared-data
    - name: build
      runAfter: [test]
      taskRef:
        name: build-image
      params:
        - name: image
          value: $(params.image)
      workspaces:
        - name: source
          workspace: shared-data
        - name: registry-auth
          workspace: registry-auth
    - name: deploy
      runAfter: [build]
      taskRef:
        name: deploy-code-engine
      params:
        - name: image
          value: $(params.image)
        - name: region
          value: $(params.ibm-region)
        - name: resource-group
          value: $(params.ibm-resource-group)
        - name: project
          value: $(params.code-engine-project)
        - name: application
          value: $(params.application)
      workspaces:
        - name: ibm-credentials
          workspace: ibm-credentials