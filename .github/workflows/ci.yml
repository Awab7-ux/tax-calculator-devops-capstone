name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Flake8
        run: flake8 app.py tax.py tests

      - name: Run tests with coverage
        run: pytest --cov=app --cov=tax --cov-report=term-missing

      - name: Build Docker image
        run: docker build -t tax-calculator:${{ github.sha }} .